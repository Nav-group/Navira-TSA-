<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Navira TSA — Console Admin</title>
<style>
  :root {
    --bg: #0A0F0C;
    --surface: #12190F;
    --card: #161F1A;
    --green: #1FE07A;
    --green-dark: #0E7A3F;
    --text: #FFFFFF;
    --muted: #9AA79E;
    --danger: #E0431F;
    --border: #233128;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header .logo-badge {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--bg);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.5px; }
  header .env { margin-left: auto; font-size: 12px; color: var(--muted); }

  #login-screen {
    max-width: 360px;
    margin: 12vh auto;
    padding: 32px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  #login-screen h2 { margin-top: 0; }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: 700;
    font-size: 14px;
  }
  .btn-primary { background: var(--green); color: var(--bg); width: 100%; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-ghost { background: transparent; color: var(--green); border: 1px solid var(--green); }
  #error-msg { color: var(--danger); font-size: 13px; min-height: 18px; }

  main { max-width: 960px; margin: 0 auto; padding: 24px; display: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .tab-btn.active { background: var(--green); color: var(--bg); border-color: var(--green); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .req-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .req-card .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .req-card h3 { margin: 0 0 6px 0; font-size: 15px; }
  .req-card .meta { color: var(--muted); font-size: 13px; margin: 2px 0; }
  .req-card .photos { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .req-card .photos img {
    width: 90px; height: 90px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--border);
  }
  .req-actions { display: flex; gap: 8px; margin-top: 10px; }
  .empty-state { color: var(--muted); text-align: center; padding: 40px 0; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; }

  .badge { padding: 3px 8px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .badge-pending { background: rgba(255,193,7,0.15); color: #FFC107; }
</style>
</head>
<body>

<header>
  <div class="logo-badge">N</div>
  <h1>NAVIRA TSA — Console Admin</h1>
  <span class="env" id="admin-email-label"></span>
</header>

<div id="login-screen">
  <h2>Connexion administrateur</h2>
  <input id="login-email" type="email" placeholder="Adresse email" autocomplete="username" />
  <input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
  <div id="error-msg"></div>
  <button class="btn-primary" onclick="handleLogin()">Se connecter</button>
</div>

<main id="app">
  <div class="tabs">
    <button class="tab-btn active" data-tab="streamers">Demandes streamers</button>
    <button class="tab-btn" data-tab="withdrawals">Demandes de retrait</button>
    <button class="tab-btn" data-tab="users">Streamers validés</button>
    <button class="tab-btn btn-ghost" style="margin-left:auto" onclick="handleLogout()">Se déconnecter</button>
  </div>

  <div class="tab-panel active" id="panel-streamers">
    <div id="streamers-list" class="empty-state">Chargement...</div>
  </div>

  <div class="tab-panel" id="panel-withdrawals">
    <div id="withdrawals-list" class="empty-state">Chargement...</div>
  </div>

  <div class="tab-panel" id="panel-users">
    <table>
      <thead><tr><th>Nom</th><th>Email</th><th>Pays</th><th>Abonnés</th></tr></thead>
      <tbody id="users-table-body"></tbody>
    </table>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, query, where, onSnapshot,
    doc, getDoc, updateDoc, setDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Même config que l'app mobile Navira TSA
  const firebaseConfig = {
    apiKey: "AIzaSyDodm5Ot02VSkpvOkC1zhGRH3lc7RRLZ7o",
    authDomain: "navira-tsa-371c8.firebaseapp.com",
    projectId: "navira-tsa-371c8",
    storageBucket: "navira-tsa-371c8.firebasestorage.app",
    messagingSenderId: "1062349149824",
    appId: "1:1062349149824:web:680bbabb15608f21cbb865",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.handleLogin = async function () {
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    const errorEl = document.getElementById("error-msg");
    errorEl.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      errorEl.textContent = "Identifiants incorrects.";
    }
  };

  window.handleLogout = function () {
    signOut(auth);
  };

  onAuthStateChanged(auth, async (user) => {
    const loginScreen = document.getElementById("login-screen");
    const appEl = document.getElementById("app");

    if (!user) {
      loginScreen.style.display = "block";
      appEl.style.display = "none";
      return;
    }

    // Vérifie que ce compte est bien répertorié comme admin
    // (collection "admins", document = uid — voir firestore.rules)
    const adminDoc = await getDoc(doc(db, "admins", user.uid));
    if (!adminDoc.exists()) {
      document.getElementById("error-msg").textContent =
        "Ce compte n'a pas les droits administrateur.";
      await signOut(auth);
      return;
    }

    loginScreen.style.display = "none";
    appEl.style.display = "block";
    document.getElementById("admin-email-label").textContent = user.email;

    listenStreamerRequests();
    listenWithdrawalRequests();
    listenValidatedStreamers();
  });

  // --- Onglets ---
  document.querySelectorAll(".tab-btn[data-tab]").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn[data-tab]").forEach((b) => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
    });
  });

  // --- Demandes de validation streamer (KYC) ---
  function listenStreamerRequests() {
    const q = query(collection(db, "streamer_requests"), where("status", "==", "en_attente"));
    onSnapshot(q, (snap) => {
      const container = document.getElementById("streamers-list");
      if (snap.empty) {
        container.innerHTML = '<div class="empty-state">Aucune demande en attente.</div>';
        return;
      }
      container.innerHTML = "";
      snap.forEach((docSnap) => {
        const r = docSnap.data();
        const el = document.createElement("div");
        el.className = "req-card";
        el.innerHTML = `
          <div class="row">
            <div>
              <h3>${r.firstName || ""} ${r.lastName || ""}</h3>
              <div class="meta">📍 ${r.city || "?"}, ${r.country || "?"}</div>
              <div class="meta">🎂 Naissance : ${r.birthDate || "?"}</div>
            </div>
            <span class="badge badge-pending">En attente</span>
          </div>
          <div class="photos">
            ${r.profilePhotoUrl ? `<img src="${r.profilePhotoUrl}" alt="profil" />` : ""}
            ${r.idFrontUrl ? `<img src="${r.idFrontUrl}" alt="CNI recto" />` : ""}
            ${r.idBackUrl ? `<img src="${r.idBackUrl}" alt="CNI verso" />` : ""}
            ${r.selfieWithIdUrl ? `<img src="${r.selfieWithIdUrl}" alt="selfie" />` : ""}
          </div>
          <div class="req-actions">
            <button class="btn-primary" data-action="approve" data-id="${docSnap.id}" data-user="${r.userId}">Valider</button>
            <button class="btn-danger" data-action="reject" data-id="${docSnap.id}">Refuser</button>
          </div>
        `;
        container.appendChild(el);
      });

      container.querySelectorAll("[data-action='approve']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await updateDoc(doc(db, "streamer_requests", btn.dataset.id), { status: "valide" });
          await setDoc(doc(db, "users", btn.dataset.user), { isStreamer: true }, { merge: true });
        });
      });
      container.querySelectorAll("[data-action='reject']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await updateDoc(doc(db, "streamer_requests", btn.dataset.id), { status: "refuse" });
        });
      });
    });
  }

  // --- Demandes de retrait ---
  function listenWithdrawalRequests() {
    const q = query(collection(db, "withdrawal_requests"), where("status", "==", "en_attente"));
    onSnapshot(q, (snap) => {
      const container = document.getElementById("withdrawals-list");
      if (snap.empty) {
        container.innerHTML = '<div class="empty-state">Aucune demande de retrait en attente.</div>';
        return;
      }
      container.innerHTML = "";
      snap.forEach((docSnap) => {
        const r = docSnap.data();
        const el = document.createElement("div");
        el.className = "req-card";
        el.innerHTML = `
          <div class="row">
            <div>
              <h3>${r.coinsAmount} coins</h3>
              <div class="meta">💳 ${r.method} — ${r.phoneNumber}</div>
              <div class="meta">Streamer ID : ${r.streamerId}</div>
            </div>
            <span class="badge badge-pending">En attente</span>
          </div>
          <div class="req-actions">
            <button class="btn-primary" data-action="approve" data-id="${docSnap.id}">Marquer comme payé</button>
            <button class="btn-danger" data-action="reject" data-id="${docSnap.id}">Refuser</button>
          </div>
        `;
        container.appendChild(el);
      });

      container.querySelectorAll("[data-action='approve']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await updateDoc(doc(db, "withdrawal_requests", btn.dataset.id), { status: "paye" });
        });
      });
      container.querySelectorAll("[data-action='reject']").forEach((btn) => {
        btn.addEventListener("click", async () => {
          await updateDoc(doc(db, "withdrawal_requests", btn.dataset.id), { status: "refuse" });
        });
      });
    });
  }

  // --- Liste des streamers validés ---
  function listenValidatedStreamers() {
    const q = query(collection(db, "users"), where("isStreamer", "==", true));
    onSnapshot(q, (snap) => {
      const tbody = document.getElementById("users-table-body");
      tbody.innerHTML = "";
      snap.forEach((docSnap) => {
        const u = docSnap.data();
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${u.firstName || ""} ${u.lastName || ""}</td>
          <td>${u.email || ""}</td>
          <td>${u.country || ""}</td>
          <td>${u.followersCount || 0}</td>
        `;
        tbody.appendChild(tr);
      });
    });
  }
</script>

</body>
</html>
